<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italian Haven Consultation</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin:0;
  background:#fefcf8;
  -webkit-font-smoothing: antialiased;
}

.container { max-width:1200px; margin:auto; padding:20px; }

h1,h2,h3 { color:#2c3e2f; }

.btn {
  background:#c97e2a;
  color:white;
  padding:12px 25px;
  border-radius:30px;
  text-decoration:none;
}

.hero img {
  width:100%;
  border-radius:20px;
}

.gallery {
  display:flex;
  flex-wrap:wrap;
  gap:20px;
}

.gallery-item {
  flex:1 1 300px;
  overflow:hidden;
  border-radius:20px;
}

.gallery-item img {
  width:100%;
  height:260px;
  object-fit:cover;
  filter:contrast(1.05) saturate(1.05);
}

.card {
  background:white;
  padding:20px;
  border-radius:20px;
  flex:1 1 250px;
}

.services { display:flex; flex-wrap:wrap; gap:20px; }

.whatsapp {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:50px;
  text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>Italian Haven Consultation</h1>

<section class="hero">
<img src="https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?auto=compress&cs=tinysrgb&w=1920">
</section>

<h2>Services</h2>

<div class="services">

<div class="card">
<h3>Bureaucracy & Visas</h3>
<p>Permits, codice fiscale, residence help.</p>
</div>

<div class="card">
<h3>Property Help</h3>
<p>Find and secure housing safely.</p>
</div>

<div class="card">
<h3>Translation Services</h3>
<p>Italian ↔ English translation for documents, contracts and communication.</p>
</div>

</div>

<h2>Gallery</h2>

<div class="gallery">

<div class="gallery-item">
<img src="https://images.pexels.com/photos/208701/pexels-photo-208701.jpeg?auto=compress&cs=tinysrgb&w=1600">
</div>

<div class="gallery-item">
<img src="https://images.pexels.com/photos/1796730/pexels-photo-1796730.jpeg?auto=compress&cs=tinysrgb&w=1600">
</div>

<div class="gallery-item">
<img src="https://images.pexels.com/photos/532826/pexels-photo-532826.jpeg?auto=compress&cs=tinysrgb&w=1600">
</div>

<div class="gallery-item">
<img src="https://images.pexels.com/photos/373639/pexels-photo-373639.jpeg?auto=compress&cs=tinysrgb&w=1600">
</div>

</div>

<h2>Contact</h2>

<form id="form">
<input type="text" placeholder="Your name"><br><br>
<input type="email" placeholder="Email"><br><br>
<textarea placeholder="Your message"></textarea><br><br>
<button class="btn">Send</button>
</form>

</div>

<a href="#" class="whatsapp" id="waBtn">
<i class="fab fa-whatsapp"></i>
</a>

<script>
document.getElementById("waBtn").onclick = function() {
  const name = document.querySelector('input').value || "No name";
  const email = document.querySelector('input[type=email]').value || "No email";
  const msg = document.querySelector('textarea').value || "No message";

  const text = `Hello Yasir,%0AName:${name}%0AEmail:${email}%0AMessage:${msg}`;
  window.open(`https://wa.me/393510578614?text=${text}`);
};
</script>

</body>
</html>
